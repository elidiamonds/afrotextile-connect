kind = "video"
previewPath = "/afrotextile-promo/"
title = "Afrotextile Promo"
version = "1.0.0"
id = "artifacts/afrotextile-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/afrotextile-promo/" ]
localPort = 19061

[services.development]
run = "pnpm --filter @workspace/afrotextile-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/afrotextile-promo", "run", "build" ]
publicDir = "artifacts/afrotextile-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19061"
BASE_PATH = "/afrotextile-promo/"
