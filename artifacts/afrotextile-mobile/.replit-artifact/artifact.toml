kind = "mobile"
previewPath = "/mobile/"
title = "Afrotextile Mobile"
version = "1.0.0"
id = "artifacts/afrotextile-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 23716

[services.development]
run = "pnpm --filter @workspace/afrotextile-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/afrotextile-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/afrotextile-mobile", "run", "serve" ]

[services.env]
PORT = "23716"
BASE_PATH = "/mobile/"
